# Additions only; mpv defaults stay. Full list: mpv --input-keylist / man mpv
MBTN_RIGHT  cycle pause
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
h           seek -5
l           seek 5
H           seek -60
L           seek 60
y           set clipboard/text "${path}" ; show-text "Copied path"
DEL         run gio trash "${path}" ; show-text "Trashed" ; playlist-remove current
