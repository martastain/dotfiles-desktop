# docs: man mpv. Defaults keys: Space pause, ←/→ seek, f fullscreen, m mute, 9/0 volume, j sub, # audio track, s screenshot
profile=high-quality
vo=gpu-next
hwdec=auto-safe
fs=yes
keep-open=yes
save-position-on-quit=no
watch-later-options-remove=fullscreen
autofit-larger=90%x90%
cursor-autohide=1000
osd-bar-align-y=0.9
osd-font-size=32

volume-max=150
alang=cs,cze,ces,en,eng
slang=cs,cze,ces,en,eng
sub-auto=fuzzy
audio-file-auto=fuzzy
sub-font-size=44
sub-border-size=2.5

screenshot-dir=~/Pictures/Screenshots
screenshot-template=mpv-%F-%P
screenshot-format=png

ytdl-format=bestvideo[height<=?1440]+bestaudio/best

# audio files: no window unless there's cover art, no fullscreen
[audio]
profile-cond=not vid or (p["current-tracks/video"] and p["current-tracks/video"].image)
profile-restore=copy
fs=no
